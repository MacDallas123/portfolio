name: Deploy to VPS

# === Réponse à la question : combien de secrets dois-je créer sur GitHub ? ===
#
# Pour que ce workflow fonctionne correctement, tu dois créer les secrets suivants dans
# les paramètres de ton dépôt GitHub (Settings > Secrets and variables > Actions):
#
# 1. VPS_HOST           = Adresse IP ou nom de domaine de ton serveur VPS
# 2. VPS_USER           = Nom d’utilisateur SSH de ton VPS
# 3. SSH_PRIVATE_KEY    = Clé privée SSH permettant la connexion (format PEM, sans mot de passe recommandé)
# 4. VPS_PORT           = (optionnel, défaut: 22) Port SSH de ton VPS (ex: 22)
# 5. VPS_PATH           = Chemin absolu vers le répertoire projet sur ton VPS (ex: /home/USERNAME/portfolio)
# 6. ENV_PRODUCTION     = (optionnel, mais recommandé) Contenu de ton fichier .env pour le serveur de prod
#
# Résumé : AU MOINS 5 secrets obligatoires (si VPS_PORT n'est pas nécessaire, 4 suffisent mais bon usage !)
# ENV_PRODUCTION est RECOMMANDÉ pour injecter la config prod à chaque déploiement (SMTP, etc.)
# ==========================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-check:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  deploy:
    name: Deploy to VPS via SSH
    needs: lint-and-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      # appleboy/ssh-action@v1.0.3 doit recevoir la clé directement via l'option "key" pour éviter le problème "getKeyFile error: open private_key.pem: permission denied".
      # On ne crée donc PLUS le fichier private_key.pem ici, la clé est injectée via `${{ secrets.SSH_PRIVATE_KEY }}` dans l'input "key".

      - name: Execute remote SSH commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_PRODUCTION
          script: |
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            if [ -n "$ENV_PRODUCTION" ]; then
              echo "$ENV_PRODUCTION" > .env
            fi
            docker compose up -d --build
   