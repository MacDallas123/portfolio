name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint-and-check:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  deploy:
    name: Deploy to VPS
    needs: lint-and-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy repository files to VPS via rsync
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${VPS_PORT:-22} -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='portfolio.zip' \
            -e "ssh -p ${VPS_PORT:-22}" \
            ./ ${VPS_USER}@${VPS_HOST}:${VPS_PATH}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

      - name: Build & Run Docker container on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_PRODUCTION
          script: |
            cd ${{ secrets.VPS_PATH }}
            if [ -n "$ENV_PRODUCTION" ]; then
              echo "$ENV_PRODUCTION" > .env
            fi
            docker compose up -d --build